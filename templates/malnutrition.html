<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malnutrition Classifier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: #000;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background-image: 
        radial-gradient(circle at 25% 25%, rgba(120, 0, 200, 0.2) 0%, transparent 20%),
        radial-gradient(circle at 75% 75%, rgba(100, 0, 180, 0.2) 0%, transparent 20%);
}

/* الهيدر */
header {
    background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
    padding: 20px 0;
    box-shadow: 0 4px 20px rgba(138, 43, 226, 0.4);
    border-bottom: 1px solid #6a3093;
}

.header-content {
    width: 90%;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 60px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo i {
    font-size: 2.2rem;
    color: #9370db;
    text-shadow: 0 0 10px rgba(147, 112, 219, 0.7);
    vertical-align: middle;
    line-height: 1;
    position: relative;
    top: 2px;
}

.logo h1 {
    font-size: 1.8rem;
    background: linear-gradient(45deg, #9370db, #8a2be2);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 5px rgba(147, 112, 219, 0.5);
    margin: 0;
    line-height: 1;
    vertical-align: middle;
}

.header-nav {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 0;
    justify-content: flex-end;
}

.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 20px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #6a3093, #4b0082);
    color: white;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(106, 48, 147, 0.4);
    position: relative;
    overflow: hidden;
    font-weight: 500;
    font-size: 1rem;
}

.btn i {
    font-size: 1.1rem;
    margin-right: 5px;
}

.btn::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
        45deg,
        transparent, 
        rgba(255, 255, 255, 0.2), 
        transparent
    );
    transform: rotate(45deg);
    transition: all 0.5s ease;
    animation: shine 3s infinite;
}

@keyframes shine {
    0% {
        left: -50%;
    }
    100% {
        left: 150%;
    }
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(106, 48, 147, 0.6);
}

.btn:hover::before {
    animation: shine 0.75s;
}

.btn:active {
    transform: translateY(0);
    box-shadow: 0 5px 15px rgba(106, 48, 147, 0.4);
}

h1 {
    text-align: center;
    margin-bottom: 30px;
    color: #e6e6fa;
    font-size: 2.2rem;
    text-shadow: 0 0 10px rgba(147, 112, 219, 0.7);
    position: relative;
    padding-bottom: 15px;
}

h1::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 3px;
    background: linear-gradient(90deg, transparent, #9370db, transparent);
}

.container {
    width: 90%;
    max-width: 500px;
    margin: 30px auto;
    padding: 30px;
    background: rgba(20, 20, 20, 0.8);
    border-radius: 15px;
    box-shadow: 0 0 30px rgba(138, 43, 226, 0.3);
    border: 1px solid #4b0082;
    flex-grow: 1;
}

form {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-top: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group label {
    margin-bottom: 8px;
    color: #d8bfd8;
    font-weight: 500;
}

input, select {
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #6a3093;
    background: rgba(30, 30, 30, 0.8);
    color: white;
    font-size: 1rem;
    transition: all 0.3s ease;
}

input:focus, select:focus {
    outline: none;
    border-color: #9370db;
    box-shadow: 0 0 10px rgba(147, 112, 219, 0.5);
}

input::placeholder {
    color: #aaa;
}

.form-submit {
    display: flex;
    justify-content: center;
    margin-top: 10px;
}

.submit-btn {
    padding: 15px 40px;
    font-size: 1.1rem;
    background: linear-gradient(135deg, #6a3093, #4b0082);
    color: white;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(106, 48, 147, 0.4);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 10px;
}

.submit-btn::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
        45deg,
        transparent, 
        rgba(255, 255, 255, 0.2), 
        transparent
    );
    transform: rotate(45deg);
    transition: all 0.5s ease;
    animation: shine 3s infinite;
}

.submit-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(106, 48, 147, 0.6);
}

.submit-btn:hover::before {
    animation: shine 0.75s;
}

.result-box {
    margin-top: 30px;
    padding: 20px;
    background: rgba(30, 30, 30, 0.8);
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    border: 1px solid #6a3093;
}

.result-box h2 {
    margin-bottom: 15px;
    color: #e6e6fa;
}

.anemic, .non-anemic {
    padding: 5px 15px;
    border-radius: 20px;
    font-weight: bold;
}

.anemic {
    background: linear-gradient(135deg, #ff4d4d, #cc0000);
    color: white;
}

.non-anemic {
    background: linear-gradient(135deg, #4cd964, #2ecc71);
    color: white;
}

/* الفوتر */
footer {
    background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
    padding: 20px 0;
    text-align: center;
    margin-top: auto;
    border-top: 1px solid #6a3093;
    box-shadow: 0 -4px 20px rgba(138, 43, 226, 0.4);
}

footer p {
    color: #9370db;
    font-size: 0.9rem;
}

/* تأثيرات responsive */
@media (max-width: 600px) {
    .container {
        width: 95%;
        padding: 20px;
    }
    .header-content {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }
    .header-nav {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        margin-bottom: 20px;
    }
    .btn {
        width: 100%;
        max-width: 280px;
        justify-content: flex-start;
    }
    .logo h1 {
        font-size: 1.2rem;
    }
    .logo i {
        font-size: 1.5rem;
    }
}
    </style>
</head>
<body>
    <!-- الهيدر -->
    <header>
        <div class="header-content">
            <a href="{{ url_for('home') }}" style="text-decoration:none;">
                <div class="logo">
                    <i class="fas fa-heartbeat"></i>
                    <h1>Health AI Classifiers</h1>
                </div>
            </a>
            <div class="header-nav">
                <a href="{{ url_for('home') }}" class="btn">
                    <i class="fas fa-home"></i>
                    Back Home
                </a>
                <a href="{{ url_for('anemia') }}" class="btn">
                    <i class="fas fa-tint"></i>
                    Anemia Classifier
                </a>
            </div>
        </div>
    </header>
    
    <!-- المحتوى الرئيسي -->
    <div class="container">
        <h1> Classifier</h1>
        
        <form method="POST">
            <div class="form-group">
                <label for="gender"><i class="fas fa-venus-mars"></i> Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="0">Female</option>
                    <option value="1">Male</option>
                </select>
            </div>
            <div class="form-group">
                <label for="hemoglobin"><i class="fas fa-vial"></i> Hemoglobin</label>
                <input type="number" id="hemoglobin" name="hemoglobin" step="0.1" placeholder="Hemoglobin" required>
            </div>
            <div class="form-group">
                <label for="mch"><i class="fas fa-vials"></i> MCH</label>
                <input type="number" id="mch" name="mch" step="0.1" placeholder="MCH" required>
            </div>
            <div class="form-group">
                <label for="mchc"><i class="fas fa-vials"></i> MCHC</label>
                <input type="number" id="mchc" name="mchc" step="0.1" placeholder="MCHC" required>
            </div>
            <div class="form-group">
                <label for="mcv"><i class="fas fa-vials"></i> MCV</label>
                <input type="number" id="mcv" name="mcv" step="0.1" placeholder="MCV" required>
            </div>
            <div class="form-submit">
                <button type="submit" class="submit-btn">
                    <i class="fas fa-search"></i>
                    Predict
                </button>
            </div>

            {% if result %}
            <div class="result-box">
                <h2>Prediction: <span class="{{ result|lower }}">{{ result }}</span></h2>
            </div>
            {% endif %}
        </form>
    </div>
    
    <!-- الفوتر -->
    <footer>
</body>
</html>
